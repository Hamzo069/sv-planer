  function up(){down=false}
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('pointerleave',up);
  document.getElementById('sigclr').onclick=function(){x.clearRect(0,0,r.width,r.height);ink=false};

function sjd(d){return d?sj(String(d).length>10?d:d+'T00:00'):'–'}
function curSj(){return sjd(today())}
function sjList(){
  var set={};function add(d){var y=sjd(d);if(y&&y!=='–')set[y]=1}
  S.sessions.forEach(function(s){add(s.datum);s.aufgaben.forEach(function(t){add(t.frist)})});
  S.projekte.forEach(function(p){add(p.termin);p.aufg.forEach(function(a){add(a.frist)})});
  S.antraege.forEach(function(a){add(a.datum)});add(today());
  return Object.keys(set).sort();
}
function sjOpts(cur,id,ui_){return '<select id="'+id+'" data-ui="'+ui_+'">'+sjList().map(function(y){return '<option value="'+y+'"'+(y===cur?' selected':'')+'>Schuljahr '+y+'</option>'}).join('')+'</select>'}
function ensureSj(k){var l=sjList();if(l.indexOf(ui[k])<0)ui[k]=l.indexOf(curSj())>=0?curSj():l[l.length-1];return ui[k]}

/* ---- Jahresplan ---- */
function planItems(y){
  var it=[];
  function add(o){if(o.d&&sjd(o.d)===y)it.push(o)}
  S.sessions.forEach(function(s){
    var d=(s.datum||'').slice(0,10),a='data-sid="'+s.id+'"';
    add({d:d,tm:(s.datum||'').slice(11,16),k:'Sitzung',c:'accent',t:(s.titel||'Sitzung')+(s.status==='abgesagt'?' (abgesagt)':''),done:s.status==='abgesagt'||s.status==='gehalten'||s.status==='protokolliert',act:'open',attr:a});
    s.aufgaben.forEach(function(t){add({d:t.frist,k:'Aufgabe',c:'',t:(t.text||'Aufgabe')+(t.wer?' · '+t.wer:''),done:t.done,task:true,act:'open',attr:a})});
    if(s.status==='geplant'&&s.datum)add({d:addDays(d,-GO().ladung),k:'Einladung',c:'warn',t:'Einladung spätestens · '+(s.titel||'Sitzung'),done:false,task:true,act:'open',attr:a});
    if((s.status==='gehalten')&&GO().protfrist>0&&fg(s).st==='entwurf'&&s.datum)add({d:addDays(d,GO().protfrist),k:'Protokoll',c:'warn',t:'Protokoll verteilen bis · Sitzung vom '+d2(s.datum),done:false,task:true,act:'open',attr:a});
    if(fg(s).st==='verteilt'&&fg(s).frist)add({d:fg(s).frist,k:'Protokoll',c:'warn',t:'Einwände bis · Protokoll vom '+d2(s.datum),done:false,act:'open',attr:a});
  });
  S.projekte.forEach(function(p){
    var a='data-id="'+p.id+'"';
    add({d:p.termin,k:'Projekt',c:'good',t:p.name||'Projekt',done:p.status==='erledigt',act:'pjgo',attr:a});
    p.aufg.forEach(function(x){add({d:x.frist,k:'Projektaufgabe',c:'',t:(x.text||'Aufgabe')+' · '+(p.name||'Projekt')+(x.wer?' · '+x.wer:''),done:x.done,task:true,act:'pjgo',attr:a})});
  });
  S.umfragen.forEach(function(u){add({d:u.bis,k:'Umfrage',c:'',t:'Ende · '+(u.frage||'Umfrage'),done:u.status==='abgeschlossen',act:'ufgo',attr:'data-id="'+u.id+'"'})});
  S.antraege.forEach(function(x){if(x.status==='eingereicht'&&x.frist)add({d:x.frist,k:'Antrag',c:'warn',t:'Rückmeldung fällig · '+(x.titel||'Antrag'),done:false,task:true,act:'ango',attr:'data-id="'+x.id+'"'})});
  it.sort(function(a,b){return (a.d+(a.tm||'')).localeCompare(b.d+(b.tm||''))});
  return it;
}
function halbNote(y){
  var a=+String(y).slice(0,4);if(!a)return '';
  function cnt(f,t){return S.sessions.filter(function(s){var d=(s.datum||'').slice(0,10);return s.status!=='abgesagt'&&d>=f&&d<=t}).length}
  var c1=cnt(a+'-08-01',(a+1)+'-01-31'),c2=cnt((a+1)+'-02-01',(a+1)+'-07-31');
  function p(n,c){return '<span class="pill '+(c?'good':'warn')+'">'+n+'. Halbjahr: '+(c?c+(c===1?' Sitzung':' Sitzungen'):'noch keine Sitzung')+'</span>'}
  return '<p class="meta" style="margin-top:8px">Der Schülerrat tritt mindestens einmal pro Halbjahr zusammen (GO § 4 Abs. 2). '+p(1,c1)+' '+p(2,c2)+'</p>';
}
function vPlan(){
  var y=ensureSj('psj'),it=planItems(y),td=today();

  if(!it.length)return h+'<section class="card"><p class="empty">In diesem Schuljahr gibt es noch keine Termine.</p></section></div>';
  var mf=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}),cur='',open=false;
  it.forEach(function(x){
    var m=mf.format(dt(x.d+'T00:00'));
    if(m!==cur){if(open)h+='</section>';cur=m;open=true;h+='<section class="card"><h3 style="margin-bottom:6px">'+m+(x.d.slice(0,7)===td.slice(0,7)?' <span class="pill accent">aktueller Monat</span>':'')+'</h3>'}

    h+='<div class="toprow" style="'+(past?'opacity:.6':'')+'"><div class="frow"><span class="mono" style="min-width:6.5rem">'+esc(fRow.format(dt(x.d+'T00:00')))+(x.tm?' · '+x.tm:'')+'</span><span class="pill '+x.c+'">'+x.k+'</span><span class="grow"'+(x.done&&x.task?' style="text-decoration:line-through"':'')+'>'+esc(x.t)+'</span>'+(over?'<span class="pill bad">überfällig</span>':'')+'<button type="button" class="btn sm" data-act="'+x.act+'" '+x.attr+'>Öffnen</button></div></div>';
  });
  return h+'</section></div>';
}

}
function bnHTML(s){
  var list=s.beschluesse.filter(function(b){return b.pub!==false&&b.text});

    var r=b.ja+b.nein>0?res(b).label+' ('+b.ja+' Ja, '+b.nein+' Nein, '+b.enth+' Enth.)':'';

/* ---- Klassenübersicht ---- */
function vKl(){
  var ks=[];S.members.forEach(function(m){if(m.aktiv&&m.klasse&&ks.indexOf(m.klasse)<0)ks.push(m.klasse)});
  ks.sort(function(a,b){return a.localeCompare(b,'de',{numeric:true})});
  var held=sorted().filter(function(s){return (s.status==='gehalten'||s.status==='protokolliert')&&Object.keys(s.anw).length});
  var h='<section class="card"><h3 style="margin-bottom:6px">Klassen</h3><p class="meta" style="margin-bottom:8px">Anwesenheit je Klasse über alle gehaltenen Sitzungen mit erfasster Anwesenheit ('+held.length+'). Eine Klasse gilt als anwesend, wenn mindestens eine Person da war.</p>';
  if(!ks.length)return h+'<p class="empty">Noch keine Klassen. Trage bei den Mitgliedern die Klasse ein.</p></section>';
  ks.forEach(function(k){
    var ms=S.members.filter(function(m){return m.aktiv&&m.klasse===k});
    var ksn=ms.filter(function(m){return m.ksf==='Klassensprecher/in'}).map(function(m){return m.name}),vt=ms.filter(function(m){return m.ksf==='Stellvertreter/in'}).map(function(m){return m.name});
    var rest=ms.filter(function(m){return !m.ksf}).map(function(m){return m.name});
    var att=held.map(function(s){return ms.some(function(m){return s.anw[m.id]==='ja'})});
    var n=att.filter(Boolean).length,miss=0;for(var i=att.length-1;i>=0&&!att[i];i--)miss++;
    h+='<div class="arow"><span><strong>'+esc(k)+'</strong> <span class="meta">'+(ksn.length?'KS: '+esc(ksn.join(', ')):'')+(vt.length?(ksn.length?' · ':'')+'Vertr.: '+esc(vt.join(', ')):'')+(rest.length?(ksn.length||vt.length?' · ':'')+esc(rest.join(', ')):'')+'</span></span><span>'+(held.length?'<span class="mono">'+n+' von '+held.length+'</span>':'<span class="meta">–</span>')+(miss>=2?' <span class="pill bad">fehlt zuletzt '+miss+'×</span>':miss===1?' <span class="pill warn">zuletzt gefehlt</span>':'')+'</span></div>';
  });
  return h+'</section>';
}

/* ---- Sitzungsmodus ---- */
function hhmm(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function mmss(sec){sec=Math.max(0,Math.floor(sec));var m=Math.floor(sec/60),s=sec%60;return pad(m)+':'+pad(s)}
function lvRun(L){return L.paused?0:(Date.now()-L.ts)/1000}
function lvTopSec(s,t){var L=s.live;return (L.sec[t.id]||0)+((s.tops[L.top]&&s.tops[L.top].id===t.id)?lvRun(L):0)}
function lvTotal(s){var L=s.live,tot=0;Object.keys(L.sec).forEach(function(k){tot+=L.sec[k]});return tot+lvRun(L)}
function rlSec(x){return (x.sec||0)+(x.t0?(Date.now()-x.t0)/1000:0)}
function rlStopAll(s){s.live.rl.forEach(function(x){if(x.t0){x.sec=(x.sec||0)+(Date.now()-x.t0)/1000;x.t0=null}})}
function lvBank(s){var L=s.live,t=s.tops[L.top];if(t&&!L.paused){L.sec[t.id]=(L.sec[t.id]||0)+(Date.now()-L.ts)/1000}L.ts=Date.now()}

function lvTick(){
  if(ui.view!=='live')return;
  var s=sess(ui.sid);if(!s||!s.live||!s.live.on)return;
  try{var a=$('#lv-tot');if(a)a.textContent=mmss(lvTotal(s))}catch(e){}
  try{var b=$('#lv-top'),t=s.tops[s.live.top];if(b&&t){var e2=lvTopSec(s,t);b.textContent=mmss(e2);var m=+b.dataset.min;b.classList.toggle('over',m>0&&e2>m*60)}}catch(e){}
  try{(s.live.rl||[]).forEach(function(x){var r=$('#rt-'+x.id);if(r){var v=rlSec(x);r.textContent=mmss(v);r.classList.toggle('over',s.live.limit>0&&v>s.live.limit)}})}catch(e){}
}
setInterval(lvTick,1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)lvTick()});

/* ---- Anwesenheits-Tracking ---- */
function aSessions(y){return sorted().filter(function(s){return sjd(s.datum)===y&&(s.status==='gehalten'||s.status==='protokolliert')})}
function aClassRep(s){var rep={};S.members.forEach(function(m){if(m.klasse&&s.anw[m.id]==='ja')rep[m.klasse]=true});return rep}
function aData(y){
  var ses=aSessions(y),reps=ses.map(aClassRep);

function protokollMD(s){
  var q=quorum(s),L=[],st={ja:'anwesend',entsch:'entschuldigt',nein:'fehlt','':'offen'};
  L.push('# Protokoll: '+s.titel,'','- **Gremium:** '+S.settings.name,'- **Datum:** '+dateLabel(s.datum));
  if(s.ort)L.push('- **Ort:** '+s.ort);
  L.push('','## Anwesenheit','');
  S.members.filter(function(m){return m.aktiv}).forEach(function(m){L.push('- '+m.name+' ('+m.rolle+(m.stimm?'':', beratend')+'): '+st[s.anw[m.id]||''])});
  L.push('','Beschlussfähigkeit: '+(q.ok?'ja':'nein')+' ('+q.present+' von '+q.N+' Stimmberechtigten anwesend, benötigt '+q.need+')','','## Tagesordnung','');
  s.tops.forEach(function(t,i){L.push('### TOP '+(i+1)+': '+t.titel);if(t.notiz)L.push('',t.notiz);L.push('')});
  if(s.beschluesse.length){L.push('## Beschlüsse','');s.beschluesse.forEach(function(b,i){L.push((i+1)+'. '+b.text+' (Ja '+b.ja+', Nein '+b.nein+', Enthaltung '+b.enth+': '+res(b).label+')')});L.push('')}
  if(s.aufgaben.length){L.push('## Aufgaben','');s.aufgaben.forEach(function(t){L.push('- ['+(t.done?'x':' ')+'] '+t.text+(t.wer?' ('+t.wer+')':'')+(t.frist?', bis '+fristLabel(t.frist):''))});L.push('')}
  if(s.protokoll)L.push('## Weitere Notizen','',s.protokoll,'');
  return L.join('\n');
}

function vAufg(){
  var all=allTasks(),who=[];
  all.forEach(function(t){if(t.wer&&who.indexOf(t.wer)<0)who.push(t.wer)});
  who.sort();
  if(ui.who&&who.indexOf(ui.who)<0)ui.who='';
  var f=all.filter(function(t){return !ui.who||t.wer===ui.who});
  var od=f.filter(function(t){return !t.done&&t.frist&&t.frist<today()}).sort(byFrist);
  var open=f.filter(function(t){return !t.done&&!(t.frist&&t.frist<today())}).sort(byFrist);
  var done=f.filter(function(t){return t.done});
  function grp(title,list){return list.length?'<div class="grp">'+title+' · '+list.length+'</div>'+list.map(function(t){return taskRow(t,true)}).join(''):''}
  return '<section class="card"><div class="vh"><h2>Aufgaben</h2><div class="frow"><label class="meta" for="whosel">Zuständig</label><select id="whosel" data-ui="who" style="width:auto">'+opts([['','Alle']].concat(who.map(function(w){return [w,w]})),ui.who)+'</select></div></div>'+
    (f.length?grp('Überfällig',od)+grp('Offen',open)+grp('Erledigt',done):'<p class="empty">Noch keine Aufgaben. Sie entstehen in der jeweiligen Sitzung.</p>')+'</section>';
}

function beschlList(){
  var q=ui.q.trim().toLowerCase(),rows=[];
  S.sessions.forEach(function(s){s.beschluesse.forEach(function(b){rows.push({s:s,b:b})})});
  rows.sort(function(x,y){return (y.s.datum||'').localeCompare(x.s.datum||'')});
  var f=rows.filter(function(r){return !q||(r.b.text+' '+r.s.titel).toLowerCase().indexOf(q)>=0});
  if(!f.length)return '<p class="empty">'+(rows.length?'Kein Beschluss passt zur Suche.':'Noch keine Beschlüsse erfasst. Sie entstehen in der jeweiligen Sitzung.')+'</p>';

}

    Neutralino.os.showSaveDialog('Speichern unter',{defaultPath:String(o.filename)}).then(function(p){

      return Neutralino.filesystem.writeFile(p,String(o.data)).then(function(){res()});
    }).catch(rej);return;
  }
  try{
    var ext=(String(o.filename).split('.').pop()||'').toLowerCase(),mt={html:'text/html',json:'application/json',csv:'text/csv',txt:'text/plain',md:'text/markdown',pdf:'application/pdf'}[ext]||'application/octet-stream';
    var blob=bin?o.data:new Blob([o.data],{type:mt+';charset=utf-8'}),a=document.createElement('a');

var CL={on:false,client:null,user:null,state:'login',base:null,busy:false,seq:0,timer:null,cid:'c'+Math.random().toString(36).slice(2,10),row:null,rend:false,ch:null,poll:null,last:'',err:''};
var CLB=KEY+'-cloudbase';
function jeq(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x)}
function idArr(a){return Array.isArray(a)&&a.every(function(x){return isObj(x)&&typeof x.id==='string'})}
function idMap(a){var m={};(a||[]).forEach(function(x){m[x.id]=x});return m}
function merge3(b,l,r){
  if(jeq(l,b))return r;
  if(jeq(r,b)||jeq(l,r))return l;
  if(isObj(l)&&isObj(r)){
    var bb=isObj(b)?b:{},o={};
    Object.keys(l).concat(Object.keys(r)).forEach(function(k){
      if(k in o)return;
      var inl=k in l,inr=k in r,inb=k in bb;
      if(inl&&inr)o[k]=merge3(bb[k],l[k],r[k]);
      else if(inl){if(!(inb&&jeq(l[k],bb[k])))o[k]=l[k]}
      else{if(!(inb&&jeq(r[k],bb[k])))o[k]=r[k]}
    });
    return o;
  }
  if(idArr(l)&&idArr(r)){
    var bm=idMap(isArr(b)?b:[]),lm=idMap(l),rm=idMap(r),out=[],seen={};
    l.forEach(function(x){
      seen[x.id]=1;
      if(x.id in rm)out.push(merge3(bm[x.id],x,rm[x.id]));
      else if(!(x.id in bm&&jeq(x,bm[x.id])))out.push(x);
    });
    r.forEach(function(x){
      if(seen[x.id])return;
      if(x.id in bm&&jeq(x,bm[x.id]))return;
      out.push(x);
    });
    return out;
  }
  return l;
}
function isArr(x){return Array.isArray(x)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function clBaseSave(){try{if(CL.base)localStorage.setItem(CLB,JSON.stringify(CL.base));else localStorage.removeItem(CLB)}catch(e){}}
function clTime(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function cloudStatus(st,err){
  if(st)CL.state=st;CL.err=err||'';
  var el=$('#cpill');if(!el)return;
  if(!CL.on){el.style.display='none';return}
  var t={login:'Cloud: nicht angemeldet',choose:'Cloud: Auswahl nötig',ok:'Cloud: synchron',pending:'Cloud: speichert …',offline:'Cloud: offline',sync:'Cloud: gleicht ab …'}[CL.state]||'';
  el.textContent=t;el.style.display='';
  el.style.background=CL.state==='ok'?'var(--good-soft)':(CL.state==='offline'||CL.state==='choose')?'var(--warn-soft)':'var(--surface2)';
  el.style.color=CL.state==='ok'?'var(--good)':(CL.state==='offline'||CL.state==='choose')?'var(--warn)':'var(--ink2)';
  if(ui.view==='daten'&&!clTyping())cloudRender();
}
function clTyping(){var ae=document.activeElement;return !!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))}
function cloudRender(){if(clTyping()){CL.rend=true;return}CL.rend=false;render()}
document.addEventListener('focusout',function(){setTimeout(function(){if(CL.rend&&!clTyping()){CL.rend=false;render()}},80)});
function cloudInit(){
  if(!(window.SV_CLOUD&&window.supabase&&window.supabase.createClient))return;
  CL.on=true;
  try{CL.client=window.supabase.createClient(window.SV_CLOUD.url,window.SV_CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true}})}catch(e){CL.on=false;return}
  try{var b=localStorage.getItem(CLB);if(b)CL.base=JSON.parse(b)}catch(e){CL.base=null}
  cloudStatus('login');
  CL.client.auth.getSession().then(function(r){
    CL.user=r&&r.data&&r.data.session?r.data.session.user:null;
    if(CL.user)cloudStart();else cloudStatus('login');
  },function(){cloudStatus('offline')});
  CL.client.auth.onAuthStateChange(function(ev,ses){
    var u=ses&&ses.user||null;
    if(ev==='SIGNED_OUT'){CL.user=null;cloudStop();cloudStatus('login')}
    else if(u&&!CL.user){CL.user=u;cloudStart()}
  });
  window.addEventListener('online',function(){if(CL.user)cloudStart()});
  window.addEventListener('focus',function(){if(CL.user&&CL.base)cloudPull()});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&CL.base&&CL.state==='pending')cloudPush()});
}
function cloudStop(){
  clearTimeout(CL.timer);clearInterval(CL.poll);CL.poll=null;
  if(CL.ch){try{CL.client.removeChannel(CL.ch)}catch(e){}CL.ch=null}
}
function cloudFetch(){
  return CL.client.from('sv_state').select('data,updated_at,updated_by').eq('id','main').maybeSingle();
}
function cloudStart(){
  cloudStatus('sync');
  cloudFetch().then(function(r){
    if(r.error){cloudStatus('offline',r.error.message);return}
    CL.row=r.data;
    if(!CL.base||!r.data){cloudStatus('choose');return}
    cloudSubscribe();cloudPull(true);
  },function(){cloudStatus('offline')});
}
function cloudSubscribe(){
  cloudStop();
  try{
    CL.ch=CL.client.channel('sv-main').on('postgres_changes',{event:'*',schema:'public',table:'sv_state',filter:'id=eq.main'},function(p){
      if(p&&p.new&&p.new.updated_by===CL.cid)return;
      cloudPull();
    }).subscribe();
  }catch(e){}
  CL.poll=setInterval(function(){if(CL.user&&CL.base&&!CL.busy)cloudPull()},20000);
}
function cloudApplyRemote(row){
  var m=merge3(CL.base?CL.base.data:{},clone(S),row.data);
  S=norm(m);
  CL.base={data:row.data,rev:row.updated_at};clBaseSave();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memOK=false}
  CL.last=clTime();
  if(!jeq(S,norm(clone(row.data))))cloudMark();
  else cloudStatus('ok');
  cloudRender();
}
function cloudPull(force){
  if(!CL.user||!CL.base||CL.busy)return;
  cloudFetch().then(function(r){
    if(r.error){cloudStatus('offline',r.error.message);return}
    if(!r.data)return;
    if(!force&&CL.base&&r.data.updated_at===CL.base.rev){if(CL.state!=='pending')cloudStatus('ok');return}
    if(CL.busy)return;
    cloudApplyRemote(r.data);
  },function(){cloudStatus('offline')});
}
function cloudMark(){
  if(!CL||!CL.on||!CL.user||!CL.base)return;
  CL.seq++;
  clearTimeout(CL.timer);CL.timer=setTimeout(cloudPush,700);
  if(CL.state!=='pending')cloudStatus('pending');
}
function cloudPush(){
  if(!CL.on||!CL.user||!CL.base)return;
  if(CL.busy){clearTimeout(CL.timer);CL.timer=setTimeout(cloudPush,500);return}
  CL.busy=true;
  var seq=CL.seq,payload=clone(S),rev=CL.base.rev;
  CL.client.from('sv_state').update({data:payload,updated_by:CL.cid,updated_at:new Date().toISOString()}).eq('id','main').eq('updated_at',rev).select('updated_at').then(function(r){
    CL.busy=false;
    if(r.error){cloudStatus('offline',r.error.message);clearTimeout(CL.timer);CL.timer=setTimeout(cloudPush,15000);return}
    if(r.data&&r.data.length){
      CL.base={data:payload,rev:r.data[0].updated_at};clBaseSave();CL.last=clTime();
      if(seq!==CL.seq){CL.timer=setTimeout(cloudPush,300)}else cloudStatus('ok');
    }else{
      /* Jemand anderes war schneller: zusammenführen und erneut senden */
      cloudFetch().then(function(q){
        if(q.error||!q.data){cloudStatus('offline',q.error&&q.error.message);return}
        cloudApplyRemote(q.data);
      },function(){cloudStatus('offline')});
    }
  },function(){CL.busy=false;cloudStatus('offline');clearTimeout(CL.timer);CL.timer=setTimeout(cloudPush,15000)});
}
function cloudTake(){
  if(!CL.row)return;
  try{localStorage.setItem(KEY+'-prevlocal',JSON.stringify(S))}catch(e){}
  S=norm(clone(CL.row.data));
  CL.base={data:CL.row.data,rev:CL.row.updated_at};clBaseSave();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  CL.last=clTime();cloudSubscribe();cloudStatus('ok');cloudRender();toast('Cloud-Daten übernommen');
}
function cloudUpload(){
  var payload=clone(S),now=new Date().toISOString();
  cloudStatus('sync');
  var q=CL.row
    ?CL.client.from('sv_state').update({data:payload,updated_by:CL.cid,updated_at:now}).eq('id','main').select('updated_at')
    :CL.client.from('sv_state').insert({id:'main',data:payload,updated_by:CL.cid,updated_at:now}).select('updated_at');
  q.then(function(r){
    if(r.error||!r.data||!r.data.length){cloudStatus('offline',r.error?r.error.message:'Speichern nicht erlaubt');toast('Hochladen fehlgeschlagen');return}
    CL.row={data:payload,updated_at:r.data[0].updated_at};
    CL.base={data:payload,rev:r.data[0].updated_at};clBaseSave();
    CL.last=clTime();cloudSubscribe();cloudStatus('ok');cloudRender();toast('Daten in der Cloud gespeichert');
  },function(){cloudStatus('offline')});
}

  vtmem:function(d){var v=S.verteiler.find(function(x){return x.id===d.id});if(!v)return 'skip';var i=v.ids.indexOf(d.m2);if(i<0)v.ids.push(d.m2);else v.ids.splice(i,1);save()},
  vtcopy:function(d){
    if(d.k==='mail'){var m=vtMails(d.id);if(!m.length){toast('Keine E-Mail-Adressen hinterlegt');return 'skip'}copyText(m.join('; '),'#none')}
    else copyText(vtList(d.id).map(function(x){return x.name}).filter(Boolean).join('\n'),'#none');
    return 'skip'},
  fgset:function(d){var s=sess(d.sid);if(!s)return 'skip';var f=fg(s);f.st=d.v;if(d.v==='verteilt'&&!f.vers)f.vers=today();if(d.v==='genehmigt'&&!f.gen)f.gen=today();save()},
  fgcopy:function(d){var s=sess(d.sid);if(s)copyText(fgText(s),'#none');return 'skip'},
  wnsave:function(){var r=ensureW();if(!r.s)return 'skip';saveFile('wahlniederschrift-'+(r.s.datum||today()).slice(0,10)+'.html',docFile(wnHTML(r.s,r.t,false),'Wahlniederschrift'));return 'skip'},
  wnhtml:function(){var r=ensureW();if(r.s)copyText(docFile(wnHTML(r.s,r.t,false),'Wahlniederschrift'),'#none');return 'skip'},
  ahsave:function(){var s=ensureA();if(!s)return 'skip';saveFile('aushang-'+(s.datum||today()).slice(0,10)+'.html',docFile(ahHTML(s,false),'Aushang'));return 'skip'},
  ahhtml:function(){var s=ensureA();if(s)copyText(docFile(ahHTML(s,false),'Aushang'),'#none');return 'skip'},
  cllogin:function(){
    var m=($('#cl-mail')||{}).value||'',pw=($('#cl-pw')||{}).value||'';
    if(!m||!pw){toast('E-Mail und Passwort eingeben');return 'skip'}
    cloudStatus('sync');
    CL.client.auth.signInWithPassword({email:m.trim(),password:pw}).then(function(r){
      if(r.error){cloudStatus('login');toast('Anmeldung fehlgeschlagen: '+(/invalid/i.test(r.error.message)?'E-Mail oder Passwort falsch':r.error.message));return}
      CL.user=r.data.user;cloudStart();
    },function(){cloudStatus('offline');toast('Keine Verbindung')});
    return 'skip'},
  cllogout:function(){cloudStop();CL.base=null;clBaseSave();CL.client.auth.signOut().then(function(){CL.user=null;cloudStatus('login');cloudRender()});return 'skip'},
  cltake:function(){cloudTake();return 'skip'},
  clup:function(){cloudUpload();return 'skip'},
  clpull:function(){cloudPull(true);toast('Abgleich gestartet');return 'skip'},
  skrcopy:function(){var el=$('#skrtext');if(el)copyText(el.value,'#skrtext');return 'skip'},
  skrsave:function(){var s=ensureA(),el=$('#skrtext');if(s&&el)saveFile('moderationsskript-'+(s.datum||today()).slice(0,10)+'.txt',el.value);return 'skip'},
  skrhtml:function(){var s=ensureA();if(!s)return 'skip';saveFile('moderationsskript-'+(s.datum||today()).slice(0,10)+'.html',docFile(skriptHTML(s),'Moderationsskript'));return 'skip'},
  skrnew:function(){var s=ensureA(),el=$('#skrtext');if(s&&el){el.value=skriptText(s);toast('Skript neu erstellt')}return 'skip'},
  einlcopy:function(){var el=$('#einltext');if(el)copyText(el.value,'#einltext');return 'skip'},
  einlsave:function(){var s=ensureA(),el=$('#einltext');if(s&&el)saveFile('einladung-'+(s.datum||today()).slice(0,10)+'.txt',el.value);return 'skip'},
  tlopen:function(d){ui.vtab='1';ui.tsid=d.sid;ui.view='vorlagen';ui.sid=null;return true},
  tlsave:function(){var s=sess(ui.tsid);if(!s)return 'skip';saveFile('teilnehmerliste-'+(s.datum||today()).slice(0,10)+'.html',docFile(tlHTML(s),'Teilnehmerliste'));return 'skip'},
  tlhtml:function(){var s=sess(ui.tsid);if(s)copyText(docFile(tlHTML(s),'Teilnehmerliste'),'#none');return 'skip'},
  protopen:function(d){ui.vtab='0';ui.psid=d.sid;ui.view='vorlagen';ui.sid=null;return true},
  protsave:function(){var s=sess(ui.psid);if(!s)return 'skip';saveFile('sitzungsprotokoll-'+(s.datum||today()).slice(0,10)+'.html',protHTMLFile(s));return 'skip'},
  prothtml:function(){var s=sess(ui.psid);if(s)copyText(protHTMLFile(s),'#none');return 'skip'},
  prottext:function(){var s=sess(ui.psid);if(s)copyText(protokollMD(s),'#none');return 'skip'},
  wahlja:function(d){var s=sess(d.sid),t=s&&s.tops.find(function(x){return x.id===d.id});if(!t)return 'skip';t.w=t.w||{};t.w.annahme=t.w.annahme===d.v?'':d.v;save()},
  besfor:function(d){sess(d.sid).beschluesse.push({id:uid(),text:'',ja:0,nein:0,enth:0,top:d.id});save()},
  rmex:function(){S.sessions=S.sessions.filter(function(s){return !s.bsp});S.members=S.members.filter(function(m){return !m.bsp});S.examples=false;if(ui.sid&&!sess(ui.sid))ui.sid=null;save()},
  jsonshow:function(){ui.json=!ui.json},
  jsoncopy:function(){copyText(JSON.stringify(S,null,2),'#jsonbox');bkSet();if(!ui.json){ui.json=true;render()}return 'skip'},
  jsonsave:function(){saveFile('sv-planer-sicherung-'+today()+'.json',JSON.stringify(S,null,2),function(){bkSet();render()});return 'skip'},
  bkdo:function(){if(DL){saveFile('sv-planer-sicherung-'+today()+'.json',JSON.stringify(S,null,2),function(){bkSet();render()});return 'skip'}ui.view='daten';ui.json=true;return true},
  bksnz:function(){try{localStorage.setItem(KEY+'-snz',today())}catch(e){}},
  imptext:function(){var v=($('#impbox')||{}).value||'';try{var o=norm(JSON.parse(v));if(!o)throw new Error('x');ui.pending=o}catch(e){toast('Das ist keine gültige Sicherung');return 'skip'}},
  impapply:function(){S=ui.pending;ui.pending=null;ui.sid=null;save();toast('Daten ersetzt')},
  impcancel:function(){ui.pending=null},
  reset:function(){if(!needConfirm('reset'))return 'skip';S=blank();ui.sid=null;save();toast('Alle Daten gelöscht')}
};
document.addEventListener('input',function(e){var t=e.target;if(!t||!t.id)return;if(t.id==='od-grund')OD().gtxt=t.value;else if(t.id==='od-gast')OD().gast=t.value});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var f=A[b.dataset.act];if(!f)return;
  pc=ui.confirm;ui.confirm=null;
  var r=f(b.dataset,b);
  if(r==='skip')return;
  render(r===true);
});

function setField(el){
  var o=null,d=el.dataset;
  if(d.m)o=mem(d.m);
  else if(d.sid){o=sess(d.sid);if(o&&d.coll)o=o[d.coll].find(function(x){return x.id===d.id})}
  else if(d.pj){o=S.projekte.find(function(x){return x.id===d.pj});if(o&&d.coll)o=o[d.coll].find(function(x){return x.id===d.id})}
  else if(d.vt)o=S.verteiler.find(function(x){return x.id===d.vt});
  else if(d.go)o=GO();
  else if(d.th)o=S.themen.find(function(x){return x.id===d.th});
  else if(d.uf){o=S.umfragen.find(function(x){return x.id===d.uf});if(o&&d.coll)o=o[d.coll].find(function(x){return x.id===d.id})}
  else if(d.ant)o=S.antraege.find(function(x){return x.id===d.ant});
  else if(d.bj){o=S.berichte[d.bj]=S.berichte[d.bj]||{einl:'',fazit:''}}
  else if(d.s)o=S.settings;
  else if(d.tp)o=tplById(d.tp);
  if(!o)return;
  if(d.sub){o[d.sub]=o[d.sub]||{};o=o[d.sub]}
  var f=d.f||d.s,v;
  if(el.type==='checkbox')v=el.checked;
  else if(el.type==='number')v=Math.max(0,Math.round(Number(el.value)||0));
  else v=el.value;
  o[f]=v;save();
}
document.addEventListener('input',function(e){
  var t=e.target,d=t.dataset;
  if(d.search!==undefined){ui.q=t.value;$('#res').innerHTML=beschlList();return}
  if(d.gentext!==undefined){if(ui.gen)ui.gen.text=t.value;return}
  if(d.rr)return;
  if(d.sid||d.m||d.s||d.tp||d.pj||d.vt||d.ant||d.bj||d.go||d.uf||d.th){setField(t);refreshDerived();if(d.s==='tlRows'){var ts=sess(ui.tsid),sh=$('#tlsheet');if(ts&&sh)sh.innerHTML=tlHTML(ts,true)}}
});
document.addEventListener('change',function(e){
  var t=e.target,d=t.dataset;
  if(d.ui){ui[d.ui]=t.value;render();return}
  if(d.gensel){ui.gen[d.gensel]=t.value;regen();render();return}
  if(t.id==='impfile'){readImport(t.files&&t.files[0]);return}
  if(d.sid||d.m||d.s||d.tp||d.pj||d.vt||d.ant||d.bj||d.go||d.uf||d.th){setField(t);if(d.rr)render();else refreshDerived()}
});

render();
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js')}catch(e){}
try{cloudInit()}catch(e){}
try{
  if(window.claude&&claude.use){
    claude.use('downloads').then(function(x){
      DL=x||null;
      var ae=document.activeElement;
      if(DL&&(!ae||ae===document.body))render();
    },function(){DL=null});
  }
}catch(e){}
})();
